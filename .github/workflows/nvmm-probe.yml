name: nvmm-probe

# QD=1 virtio-blk cost under NVMM, against KVM on the same runner.
# NVMM loads nested only when the runner is AMD (on the Intel runners
# modload nvmm answers "Not supported"), and the runner CPU cannot be
# chosen, so several identical jobs start and those on Intel stop
# early.  Starting a guest has so far left the NetBSD VM unreachable
# over ssh; 10.1 runs beside 11.0 to see whether that is release
# specific, and anyvm's debug output keeps the VM console.

on:
  push:
    branches: ['wip/nvmm-probe']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        release: ['10.1', '11.0']
        try: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Runner virtualisation
        id: cpu
        run: |
          lscpu | grep -E 'Model name|Vendor|Virtualization|Hypervisor'
          for m in kvm_intel kvm_amd; do
            f=/sys/module/$m/parameters/nested
            [ -r "$f" ] && echo "$m nested=$(cat "$f")"
          done
          if grep -q -w svm /proc/cpuinfo; then
            echo "amd=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Intel runner, NVMM does not load nested here"
          fi
      - uses: actions/checkout@v4
        if: steps.cpu.outputs.amd == 'true'
      - name: Build guest
        if: steps.cpu.outputs.amd == 'true'
        run: |
          sudo apt-get install -y -q qemu-system-x86 >/dev/null
          .github/nsrg/nvmm/mkguest.sh guest
      - name: KVM reference
        if: steps.cpu.outputs.amd == 'true'
        run: .github/nsrg/nvmm/run-kvm.sh guest
      - uses: vmactions/netbsd-vm@v1
        if: steps.cpu.outputs.amd == 'true'
        with:
          release: ${{ matrix.release }}
          cpu: 2
          debug: true
          # The image has pkg_add but not pkgin, and no X sets, which the
          # qemu package's SDL2 dependency pulls in.  (Paths below are in
          # the NetBSD guest.)
          prepare: |
            modload nvmm
            nvmmctl identify
            v=$(uname -r)
            ftp -o /var/tmp/xbase.tar.xz \
              "https://cdn.NetBSD.org/pub/NetBSD/NetBSD-$v/amd64/binary/sets/xbase.tar.xz"
            tar -xpf /var/tmp/xbase.tar.xz -C /
            /usr/sbin/pkg_add qemu
          run: .github/nsrg/nvmm/run-nvmm.sh guest
      - name: Summary
        if: steps.cpu.outputs.amd == 'true' && always()
        run: |
          .github/nsrg/nvmm/summary.sh guest/kvm.serial guest/nvmm.serial |
              tee -a "$GITHUB_STEP_SUMMARY"
          tail -n 40 guest/nvmm.serial || true
