name: ztest-import

# Experiment for wip/ztest-import only: run the sanitize job's ztest
# with and without a loaded module, counting passes that import.

on:
  push:
    branches: ['wip/ztest-import']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  count:
    strategy:
      fail-fast: false
      matrix:
        module: [loaded, absent]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: .github/nsrg/deps.sh && sudo apt-get install -y bpftrace
      - run: .github/nsrg/build.sh . debug
      - if: matrix.module == 'loaded'
        run: .github/nsrg/load.sh .
      - run: git clean -fdxq && .github/nsrg/build.sh . sanitize
      - run: sudo .github/nsrg/ztest-count.sh ${{ matrix.module }} 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zcount-${{ matrix.module }}
          path: /var/tmp/zcount-*
