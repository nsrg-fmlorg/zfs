name: nsrg-repro

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: .github/nsrg/deps.sh
      - run: .github/nsrg/build.sh . release
      - run: .github/nsrg/repro/qd1.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro
          path: /var/tmp/qd1
