name: nsrg-repro

# Branch-local: reproduce the ZIL replay hang seen in
# zvol_misc_direct_edge with a debug module and keep the kernel stacks.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/nsrg/deps.sh
      # The base of this branch, without the volume Direct I/O commits.
      - run: |
          git fetch -q origin nsrg/ci
          git worktree add -q /var/tmp/base FETCH_HEAD
          .github/nsrg/build.sh /var/tmp/base debug
          .github/nsrg/load.sh /var/tmp/base
          cd /var/tmp/base
          sudo DIAG_CASES=hdr \
              "$GITHUB_WORKSPACE"/.github/nsrg/repro/zvol-replay-diag.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro
          path: |
            /var/tmp/diag
