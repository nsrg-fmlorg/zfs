name: nsrg

# Fork-local CI for the performance branches.  The upstream workflows
# are disabled on this fork; this one runs on the runner itself.
#
#   checkstyle  the upstream style, lint and ABI checks, unchanged
#   strict      strictest warnings (W=123, sparse, -Wextra and more);
#               fails on any that land on a line this branch changed
#   build       gcc and clang, --enable-debug (which adds -Werror), unit tests
#   sanitize    userspace with ASan and UBSan; ztest drives the DMU/SPA
#               code through libzpool, so this covers the kernel code too
#   zts         debug kernel module (ASSERTs live), tags from .github/nsrg/tags
#   bench       release build, fio A/B against $BASE on the same runner

on:
  push:
    branches: ['wip/**', 'nsrg/**']
  workflow_dispatch:
    inputs:
      tags:
        description: 'ZTS tags, comma separated (default: .github/nsrg/tags)'
        default: ''
      base:
        description: 'Ref to benchmark against'
        default: 'upstream/master'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # wip/mem-measure runs only the memory and compression-latency
  # profiles; the other jobs would repeat what nsrg/ci already showed.
  memprofile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: .github/nsrg/deps.sh
      - run: .github/nsrg/memprofile.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mem
          path: /var/tmp/mem

  complat:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: .github/nsrg/deps.sh
      - run: .github/nsrg/complat.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complat
          path: /var/tmp/complat
