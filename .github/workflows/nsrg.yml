name: nsrg

# Fork-local CI for the performance branches.  The upstream workflows
# are disabled on this fork; this one runs on the runner itself.
#
#   checkstyle  the upstream style, lint and ABI checks, unchanged
#   strict      strictest warnings (W=123, sparse, -Wextra and more);
#               fails on any that land on a line this branch changed
#   build       gcc and clang, --enable-debug (which adds -Werror), unit tests
#   sanitize    userspace with ASan and UBSan; ztest drives the DMU/SPA
#               code through libzpool, so this covers the kernel code too
#   zts         debug kernel module (ASSERTs live), tags from .github/nsrg/tags
#   bench       release build, fio A/B against $BASE on the same runner
#   measure     release build, a branch's own .github/nsrg/measure.d
#               scripts, run against $BASE and this tree

on:
  push:
    branches: ['wip/**', 'nsrg/**']
  workflow_dispatch:
    inputs:
      tags:
        description: 'ZTS tags, comma separated (default: .github/nsrg/tags)'
        default: ''
      base:
        description: 'Ref to benchmark against'
        default: 'upstream/master'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkstyle:
    # Same release as upstream's checkstyle job: 24.04's cppcheck stops
    # on lib/libspl/include/sys/isa_defs.h.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: .github/nsrg/deps.sh checkstyle
      - run: .github/nsrg/build.sh . release
      - run: make -s -j"$(nproc)" checkstyle
      - run: make -s -j"$(nproc)" lint
      - id: checkabi
        run: >
          docker run -v "$PWD":/source ghcr.io/openzfs/libabigail
          make -s -j"$(nproc)" checkabi
      # As upstream does: hand back the regenerated .abi files so an
      # intended interface change can be committed from the artifact.
      - if: failure() && steps.checkabi.outcome == 'failure'
        run: |
          docker run -v "$PWD":/source ghcr.io/openzfs/libabigail \
              make -s -j"$(nproc)" storeabi
          find . -name '*.abi' | tar -cjf abi_files.tar.bz2 -T -
      - uses: actions/upload-artifact@v4
        if: failure() && steps.checkabi.outcome == 'failure'
        with:
          name: abi
          path: abi_files.tar.bz2

  strict:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/nsrg/deps.sh strict
      - run: .github/nsrg/strict.sh
        env:
          BASE: ${{ inputs.base || 'upstream/master' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict
          path: /var/tmp/strict

  build:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: .github/nsrg/deps.sh ${{ matrix.cc }}
      - run: CC=${{ matrix.cc }} .github/nsrg/build.sh . debug
      - run: make -s -j"$(nproc)" unit

  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: .github/nsrg/deps.sh
      # ztest asks the kernel module whether a pool is active before it
      # imports one (pool_active() in lib/libzpool/util.c), and without
      # a module that check fails and the import reports "no pools
      # found".  zloop.yml loads the module for the same reason.  The
      # sanitizers apply to userspace only, so the module comes from a
      # debug build and stays loaded while userspace is rebuilt.
      - run: .github/nsrg/build.sh . debug
      - run: .github/nsrg/load.sh .
      - run: git clean -fdxq && .github/nsrg/build.sh . sanitize
      - run: sudo .github/nsrg/ztest.sh

  zts:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: .github/nsrg/deps.sh
      - run: .github/nsrg/build.sh . debug
      - run: .github/nsrg/zts.sh
        env:
          TAGS: ${{ inputs.tags }}
      # Kept on success too: a test that fails one run in four is
      # traced by comparing its logs across runs.  Packed first, since
      # upload-artifact refuses the ':' in names like direct:Linux.
      - if: always()
        run: sudo tar -C /var/tmp -czf /var/tmp/zts-results.tgz test_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zts-results
          path: /var/tmp/zts-results.tgz

  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/nsrg/deps.sh
      - run: .github/nsrg/bench.sh
        env:
          BASE: ${{ inputs.base || 'upstream/master' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: |
            /var/tmp/bench
            /var/tmp/qd1
          if-no-files-found: ignore

  measure:
    # Steps, not the job, are gated: hashFiles() is not available in a
    # job-level if.  Without a measure.d script the job costs a checkout.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: hashFiles('.github/nsrg/measure.d/*.sh') != ''
        run: .github/nsrg/deps.sh
      - if: hashFiles('.github/nsrg/measure.d/*.sh') != ''
        run: .github/nsrg/measure.sh
        env:
          BASE: ${{ inputs.base || 'upstream/master' }}
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.github/nsrg/measure.d/*.sh') != ''
        with:
          name: measure
          path: /var/tmp/measure

  freebsd-build:
    # This branch changes code shared with FreeBSD (uio, abd, dbuf), so
    # build it there too.  Upstream's qemu scripts, as on wip/pr17168;
    # a VM job is slow, so only this branch pays for it.
    if: github.ref == 'refs/heads/wip/pr18854'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/scripts/qemu-1-setup.sh
      - run: .github/workflows/scripts/qemu-2-start.sh freebsd15-1r
      - run: .github/workflows/scripts/qemu-3-deps.sh --poweroff freebsd15-1r
      - run: .github/workflows/scripts/qemu-4-build.sh --enable-debug freebsd15-1r

  oldkernel:
    # Linux-Minimum in META is 4.18; build against 5.4 headers so the
    # pre-5.11 kmap branches this branch touches are compiled at all.
    if: github.ref == 'refs/heads/wip/pr18854'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: .github/nsrg/oldkernel.sh

